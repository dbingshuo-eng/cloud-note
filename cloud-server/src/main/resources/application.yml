server:
  port: 8080
spring:
  application:
    name: cloud-server
  servlet:
    multipart:
      max-file-size: 100000000B
      max-request-size: 101000000B
      file-size-threshold: 101000000B
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cloud_disk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
cloud:
  cache:
    file-list-ttl: ${FILE_LIST_CACHE_TTL:PT5M}
  share:
    verification-rate-limit:
      max-attempts: ${SHARE_VERIFY_MAX_ATTEMPTS:5}
      window: ${SHARE_VERIFY_WINDOW:PT1M}
      max-tracked-codes: ${SHARE_VERIFY_MAX_TRACKED_CODES:10000}
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
